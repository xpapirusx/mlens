# pnpm v12 blocks install scripts unless explicitly allowed.
# Electron needs its postinstall to download the runtime; node-pty needs its
# installer to select/chmod the bundled spawn helper (scripts/postinstall.cjs
# also enforces the executable bit).
allowBuilds:
  electron: true
  node-pty: true
  electron-winstaller: false

# Electron 45.3.3 is newer than the registry's minimum-release-age policy at the
# time this prototype was assembled.
minimumReleaseAgeExclude:
  - electron@45.3.3
